<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Itens - PasUp</title><link rel="icon" href="logo.png"><link rel="apple-touch-icon" href="logo.png"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body><main class="wrap"><h2 class="hi" id="tt"></h2><p class="mut" id="sb"></p><div class="stats" id="st"></div>
<div class="bar"><input id="q" placeholder="Buscar por título ou assunto" oninput="draw()"><select id="fs" onchange="draw()"><option value="">Todos os status</option><option value="pendente">Pendente</option><option value="andamento">Em andamento</option><option value="concluido">Concluído</option><option value="atrasado">Atrasado</option></select><select id="fi" onchange="draw()"><option value="">Toda importância</option><option value="alta">Alta</option><option value="media">Média</option><option value="baixa">Baixa</option></select><select id="so" onchange="draw()"><option value="data">Ordenar por data</option><option value="imp">Ordenar por importância</option><option value="tit">Ordenar por título</option></select><button class="btn" onclick="csv(P.filter(p=>p.tipo===TIPO),TIPO)">Exportar CSV</button><button class="btn" onclick="limpa()">Excluir concluídos</button><button class="btn pri" onclick="novo()">Novo item</button></div><div id="ls"></div></main><script src="common.js"></script><script>
var TIPO=new URLSearchParams(location.search).get('tipo')==='postagem'?'postagem':'planejamento';
(async()=>{if(!await shell(TIPO==='postagem'?'postagens':'planejamentos'))return;const po=TIPO==='postagem';$('tt').textContent=po?'Postagens':'Planejamentos';document.title=$('tt').textContent+' - PasUp';$('sb').textContent=po?'Organize o calendário de publicações das redes da paróquia.':'Planeje cada ação da pastoral com prazo, importância e PDF.';load()})();
const O=['alta','media','baixa'],srt=(a,b)=>{const o=$('so').value;return o==='imp'?O.indexOf(a.importancia)-O.indexOf(b.importancia):o==='tit'?a.titulo.localeCompare(b.titulo):0};
async function limpa(){const c=P.filter(p=>p.tipo===TIPO&&p.status==='concluido');if(!c.length)return alert('Não há itens concluídos.');if(confirm(`Excluir ${c.length} item(ns) concluído(s)? Essa ação não pode ser desfeita.`)){for(const p of c)await api('plans/'+p.id,'DELETE');load()}}
async function load(){P=await api('plans');draw()}
function draw(){const q=$('q').value.toLowerCase(),fs=$('fs').value,fi=$('fi').value,T=P.filter(p=>p.tipo===TIPO);stats(T);
$('ls').innerHTML=T.filter(p=>(!fs||(fs==='atrasado'?late(p):p.status===fs))&&(!fi||p.importancia===fi)&&((p.titulo||'')+(p.assunto||'')).toLowerCase().includes(q)).sort(srt).map(card).join('')||'<p class="mut">Nada por aqui ainda. Use "Novo item" para começar.</p>'}</script></body></html>
